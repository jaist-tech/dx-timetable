<!DOCTYPE html>
<html lang="ja" data-i18n-title="timetable.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時刻表一覧 - JAISTのりかえ</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1565C0;
  --bg:#F0F2F5;
  --card:#FFFFFF;
  --text:#1A1A2E;
  --text-secondary:#5F6368;
  --border:#E0E0E0;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --radius:12px;
  --header-height:56px;
}
[data-theme="dark"]{
  --primary:#64B5F6;
  --bg:#121212;
  --card:#1E1E1E;
  --text:#E0E0E0;
  --text-secondary:#9E9E9E;
  --border:#333;
  --shadow:0 2px 8px rgba(0,0,0,0.3);
}
[data-theme="dark"] header{background:#1A237E}
[data-theme="dark"] table{background:var(--card)}
[data-theme="dark"] th{background:#2A2A2A;border-color:#444;color:var(--text)}
[data-theme="dark"] td{border-color:#333;color:var(--text)}
[data-theme="dark"] tr:nth-child(even){background:#252525}
[data-theme="dark"] tr:hover{background:#333}
[data-theme="dark"] .route-note{background:#332B00;color:#FFD54F}
[data-theme="dark"] select{background:#2A2A2A;color:#E0E0E0;border-color:#444}
[data-theme="dark"] .route-header{opacity:0.85}
[data-theme="dark"] .tabs button{background:#2A2A2A;color:#9E9E9E;border-color:#444}
[data-theme="dark"] .tabs button.active{background:#283593;color:#E0E0E0;border-color:#283593}

html{font-size:16px}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100dvh;
}
button{font-family:inherit;border:none;cursor:pointer;background:none}
header{
  height:var(--header-height);
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 12px;
  position:sticky;
  top:0;
  z-index:10;
}
.header-side{display:flex;align-items:center;gap:6px;flex:1}
.header-right{justify-content:flex-end}
.header-center{
  display:flex;align-items:baseline;gap:4px;
  font-size:0.9rem;font-weight:600;
  font-variant-numeric:tabular-nums;
  flex-shrink:0;white-space:nowrap;
}
.header-center .header-time{font-size:1.25rem;font-weight:700;margin-left:4px}
.header-center #header-dow{display:inline-block;width:3em;text-align:center}
.back-btn{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;transition:background 0.2s;
  color:#fff;text-decoration:none;
}
.back-btn:hover{background:rgba(255,255,255,0.15)}
.back-btn svg{width:20px;height:20px}
.lang-dropdown{position:relative;flex-shrink:0}
.lang-dropdown-btn{
  color:#fff;font-size:0.7rem;font-weight:700;letter-spacing:0.5px;
  background:rgba(255,255,255,0.2);padding:3px 6px 3px 10px;border-radius:12px;
  display:flex;align-items:center;gap:3px;height:26px;transition:background 0.2s;cursor:pointer;
}
.lang-dropdown-btn:hover{background:rgba(255,255,255,0.35)}
.lang-dropdown-chevron{transition:transform 0.2s;opacity:0.8;flex-shrink:0}
.lang-dropdown.open .lang-dropdown-chevron{transform:rotate(180deg)}
.lang-dropdown-menu{
  display:none;position:absolute;top:calc(100% + 6px);right:0;
  background:var(--card);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.18);
  overflow:hidden;min-width:130px;z-index:100;animation:langDropIn 0.15s ease;
}
.lang-dropdown.open .lang-dropdown-menu{display:block}
@keyframes langDropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.lang-option{
  display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;
  font-size:0.82rem;font-weight:600;color:var(--text);background:none;cursor:pointer;transition:background 0.15s;
}
.lang-option:hover{background:var(--bg)}
.lang-option.active{color:var(--primary)}
.lang-option-name{font-weight:400;color:var(--text-secondary);font-size:0.78rem}
.theme-btn{
  color:#fff;opacity:0.7;display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;transition:opacity 0.2s,background 0.2s;
  flex-shrink:0;
}
.theme-btn:hover{opacity:1;background:rgba(255,255,255,0.15)}
.icon-moon{display:none}
[data-theme="dark"] .icon-sun{display:none}
[data-theme="dark"] .icon-moon{display:block}
.content{max-width:900px;margin:0 auto;padding:16px}
.controls{
  display:flex;justify-content:center;gap:12px;margin-bottom:16px;
  flex-wrap:wrap;align-items:center;
}
.controls select{
  padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:0.9rem;background:var(--card);color:var(--text);
  cursor:pointer;max-width:400px;width:100%;font-family:inherit;
}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.tabs button{
  padding:8px 20px;border:2px solid var(--border);background:var(--card);
  color:var(--text);border-radius:8px;cursor:pointer;font-size:0.9rem;
  font-family:inherit;
}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.route-header{
  padding:10px 16px;color:#fff;border-radius:var(--radius) var(--radius) 0 0;
  font-size:1rem;font-weight:700;
}
.route-note{
  padding:4px 16px;background:#fff3e0;font-size:0.8rem;color:#e65100;
}
.shadow{
  box-shadow:var(--shadow);border-radius:var(--radius);
  overflow:hidden;margin-bottom:20px;
}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{
  background:#f0f0f0;padding:6px 8px;font-size:0.75rem;
  white-space:nowrap;border:1px solid var(--border);
  position:sticky;top:0;
}
td{
  padding:5px 8px;text-align:center;font-size:0.8rem;
  border:1px solid var(--border);white-space:nowrap;
}
td:first-child,th:first-child{
  position:sticky;left:0;z-index:1;
  background:var(--card);
}
th:first-child{background:#f0f0f0}
[data-theme="dark"] th:first-child{background:#2A2A2A}
td:first-child{font-weight:600;text-align:left;white-space:normal}
tr:nth-child(even){background:#fafafa}
tr:hover{background:#e3f2fd}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.loading{text-align:center;padding:32px;color:var(--text-secondary);font-size:0.85rem}
.meta-text{text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-bottom:16px}
.meta-text a{color:var(--primary);text-decoration:none;margin-left:8px}
.meta-text a:hover{text-decoration:underline}

/* PC: full width */
@media(min-width:768px){
  .content{max-width:100%;padding:16px 32px}
}
</style>
<script>
(function(){
  var s = localStorage.getItem('theme');
  if (s) document.documentElement.setAttribute('data-theme', s);
  var l = localStorage.getItem('lang');
  if (l) document.documentElement.setAttribute('lang', l);
})();
</script>
</head>
<body>
<header>
  <div class="header-side header-left">
    <a href="about.html" class="back-btn" data-i18n-aria="header.back" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>
  <div class="header-center">
    <span id="header-date">--/--</span>
    <span id="header-dow">(-)</span>
    <span class="header-time" id="header-time">--:--</span>
  </div>
  <div class="header-side header-right">
    <div class="lang-dropdown" id="lang-dropdown">
      <button class="lang-dropdown-btn" onclick="toggleLangMenu()">
        <span class="lang-dropdown-label" id="lang-toggle">EN</span>
        <svg class="lang-dropdown-chevron" viewBox="0 0 12 8" width="10" height="7" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1.5l5 5 5-5"/></svg>
      </button>
      <div class="lang-dropdown-menu" id="lang-menu">
        <button class="lang-option" data-lang="ja" onclick="selectLang('ja')">JA <span class="lang-option-name">日本語</span></button>
        <button class="lang-option" data-lang="en" onclick="selectLang('en')">EN <span class="lang-option-name">English</span></button>
      </div>
    </div>
    <button class="theme-btn" onclick="toggleTheme()" data-i18n-aria="header.themeToggle" aria-label="テーマ切替">
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<div class="content">
  <div class="controls">
    <select id="jsonSelect" onchange="loadSelected()">
      <option value="" data-i18n="timetable.selectRoute">-- 路線を選択 --</option>
    </select>
  </div>

  <div class="tabs">
    <button class="active" onclick="switchDay('weekday', this)" data-i18n="timetable.weekday">平日</button>
    <button onclick="switchDay('weekend', this)" data-i18n="timetable.weekend">土日祝</button>
  </div>

  <div class="meta-text" id="meta"></div>
  <div id="content"><div class="loading" data-i18n="timetable.selectPrompt">路線を選択してください</div></div>
</div>

<script src="js/i18n.js"></script>
<script>
function toggleTheme() {
  var c = document.documentElement.getAttribute('data-theme');
  var n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem('theme', n);
}
function updateClock() {
  var n = new Date();
  var h = String(n.getHours()).padStart(2,'0');
  var m = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('header-time').textContent = h + ':' + m;
}

const JSON_FILES = [
  { file: 'data/segments/shuttle_tsurugi.json', i18nKey: 'timetable.route.shuttle_tsurugi', color: '#1976D2', sourceUrl: 'https://www.jaist.ac.jp/top/access/' },
  { file: 'data/segments/shuttle_komatsu.json', i18nKey: 'timetable.route.shuttle_komatsu', color: '#43A047', sourceUrl: 'https://www.jaist.ac.jp/top/access/' },
  { file: 'data/segments/ishikawa_line.json', i18nKey: 'timetable.route.ishikawa_line', color: '#6A1B9A', sourceUrl: 'https://www.hokutetsu.co.jp/railway/ishikawasen/' },
  { file: 'data/segments/ir_ishikawa.json', i18nKey: 'timetable.route.ir_ishikawa', color: '#E65100', sourceUrl: 'https://www.ishikawa-railway.jp/timetable/' },
  { file: 'data/segments/limo_komatsu.json', i18nKey: 'timetable.route.limo_komatsu', color: '#00838F', sourceUrl: 'https://www.hokutetsu.co.jp/airport-bus#station_airport' },
];
let currentColor = '#666';
let data = null;
let currentDay = 'weekday';

const select = document.getElementById('jsonSelect');
JSON_FILES.forEach(function(entry) {
  var opt = document.createElement('option');
  opt.value = entry.file;
  opt.textContent = t(entry.i18nKey);
  opt.dataset.i18nKey = entry.i18nKey;
  select.appendChild(opt);
});

async function loadSelected() {
  var file = select.value;
  if (!file) return;
  document.getElementById('content').innerHTML = '<div class="loading">' + t('timetable.loading') + '</div>';
  try {
    var res = await fetch(file);
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    var entry = JSON_FILES.find(function(e) { return e.file === file; });
    currentColor = entry ? entry.color : '#666';
    updateMeta();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">' + t('timetable.loadError') + e.message + '</div>';
  }
}

function updateMeta() {
  if (!data) return;
  var vf = data.meta.valid_from;
  var vu = data.meta.valid_until;
  var metaHtml = '';
  if (vf && vu) metaHtml = vf + ' ~ ' + vu;
  else if (vf) metaHtml = vf + ' ~';

  var entry = JSON_FILES.find(function(e) { return e.file === select.value; });
  if (entry && entry.sourceUrl) {
    if (metaHtml) metaHtml += ' ';
    metaHtml += '<a href="' + entry.sourceUrl + '" target="_blank" rel="noopener">' + t('timetable.sourceLink') + '</a>';
  }
  document.getElementById('meta').innerHTML = metaHtml;
}

function switchDay(day, btn) {
  currentDay = day;
  document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  if (data) render();
}

function render() {
  var container = document.getElementById('content');
  container.innerHTML = '';

  data.routes.forEach(function(route) {
    var trips = route.schedules[currentDay];
    var stops = route.stops;

    var wrapper = document.createElement('div');
    wrapper.className = 'shadow';

    var header = document.createElement('div');
    header.className = 'route-header';
    header.style.background = currentColor;
    header.textContent = tSegRouteName(route.name);
    wrapper.appendChild(header);

    if (route.note) {
      var note = document.createElement('div');
      note.className = 'route-note';
      note.textContent = tNote(route.note);
      wrapper.appendChild(note);
    }

    var scroll = document.createElement('div');
    scroll.className = 'table-scroll';

    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    var thStop = document.createElement('th');
    thStop.textContent = t('timetable.stopHeader');
    thStop.style.minWidth = '80px';
    headerRow.appendChild(thStop);

    trips.forEach(function(_, i) {
      var th = document.createElement('th');
      th.textContent = t('timetable.tripNum', { n: i + 1 });
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    stops.forEach(function(stop, si) {
      var tr = document.createElement('tr');
      var tdStop = document.createElement('td');
      tdStop.textContent = tStop(stop);
      tr.appendChild(tdStop);

      trips.forEach(function(trip) {
        var td = document.createElement('td');
        td.textContent = trip[si] || '\u2015';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrapper.appendChild(scroll);
    container.appendChild(wrapper);
  });
}

// Override refreshUI for timetable page
function refreshUI() {
  // Re-translate route select options
  select.querySelectorAll('option').forEach(function(opt) {
    if (opt.dataset.i18nKey) opt.textContent = t(opt.dataset.i18nKey);
    else if (opt.dataset.i18n) opt.textContent = t(opt.dataset.i18n);
  });
  // Re-render table if data loaded
  if (data) {
    updateMeta();
    render();
  } else {
    var contentEl = document.getElementById('content');
    if (contentEl) contentEl.innerHTML = '<div class="loading">' + t('timetable.selectPrompt') + '</div>';
  }
}

applyStaticTranslations();
updateClock();
setInterval(updateClock, 10000);

// Auto-load first option
select.selectedIndex = 1;
loadSelected();
</script>
</body>
</html>
