<!DOCTYPE html>
<html lang="ja" data-i18n-title="timetable.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時刻表一覧 - JAISTのりかえ</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1565C0;
  --bg:#F0F2F5;
  --card:#FFFFFF;
  --text:#1A1A2E;
  --text-secondary:#5F6368;
  --border:#E0E0E0;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --radius:12px;
  --header-height:56px;
}
[data-theme="dark"]{
  --primary:#64B5F6;
  --bg:#121212;
  --card:#1E1E1E;
  --text:#E0E0E0;
  --text-secondary:#9E9E9E;
  --border:#333;
  --shadow:0 2px 8px rgba(0,0,0,0.3);
}
[data-theme="dark"] header{background:#1A237E}
[data-theme="dark"] table{background:var(--card)}
[data-theme="dark"] th{background:#2A2A2A;border-color:#444;color:var(--text)}
[data-theme="dark"] td{border-color:#333;color:var(--text)}
[data-theme="dark"] tr:nth-child(even){background:#252525}
[data-theme="dark"] tr:hover{background:#333}
[data-theme="dark"] .route-note{background:#332B00;color:#FFD54F}
[data-theme="dark"] select{background:#2A2A2A;color:#E0E0E0;border-color:#444}
[data-theme="dark"] .route-header{opacity:0.85}
[data-theme="dark"] .tabs button{background:#2A2A2A;color:#9E9E9E;border-color:#444}
[data-theme="dark"] .tabs button.active{background:#283593;color:#E0E0E0;border-color:#283593}

html{font-size:16px}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100dvh;
}
button{font-family:inherit;border:none;cursor:pointer;background:none}
header{
  height:var(--header-height);
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 12px;
  position:sticky;
  top:0;
  z-index:10;
}
.header-side{display:flex;align-items:center;gap:6px;flex:1}
.header-right{justify-content:flex-end}
.header-center{
  display:flex;align-items:baseline;gap:4px;
  font-size:0.9rem;font-weight:600;
  font-variant-numeric:tabular-nums;
  flex-shrink:0;white-space:nowrap;
}
.header-center .header-time{font-size:1.25rem;font-weight:700;margin-left:4px}
.header-center #header-dow{display:inline-block;width:3em;text-align:center}
.back-btn{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;transition:background 0.2s;
  color:#fff;text-decoration:none;
}
.back-btn:hover{background:rgba(255,255,255,0.15)}
.back-btn svg{width:20px;height:20px}
.settings-dropdown{position:relative;flex-shrink:0}
.settings-dropdown-btn{
  color:#fff;opacity:0.8;background:rgba(255,255,255,0.15);
  padding:4px 8px;border-radius:14px;display:flex;align-items:center;gap:4px;
  height:28px;transition:opacity 0.2s,background 0.2s;cursor:pointer;
}
.settings-dropdown-btn:hover{opacity:1;background:rgba(255,255,255,0.3)}
.settings-dropdown.open .settings-dropdown-btn{opacity:1;background:rgba(255,255,255,0.3)}
.settings-sep{width:1px;height:14px;background:rgba(255,255,255,0.4);flex-shrink:0}
.settings-icon-moon{display:none}
[data-theme="dark"] .settings-icon-sun{display:none}
[data-theme="dark"] .settings-icon-moon{display:block}
.settings-backdrop{display:none;position:fixed;inset:0;z-index:1050}
.settings-dropdown.open .settings-backdrop{display:block}
.settings-dropdown-menu{
  display:none;position:absolute;top:calc(100% + 8px);right:0;
  background:var(--card);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.18);
  min-width:160px;z-index:1100;padding:6px 0;animation:settingsDropIn 0.15s ease;
}
.settings-dropdown.open .settings-dropdown-menu{display:block}
@keyframes settingsDropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.settings-group{padding:4px 0}
.settings-group+.settings-group{border-top:1px solid var(--border)}
.settings-group-label{padding:6px 14px 2px;font-size:0.7rem;font-weight:700;color:var(--text-light,#9AA0A6);text-transform:uppercase;letter-spacing:0.5px}
.settings-option{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;font-size:0.82rem;font-weight:500;color:var(--text);background:none;cursor:pointer;transition:background 0.12s}
.settings-option:hover{background:var(--bg)}
.settings-check{width:18px;font-size:0.85rem;font-weight:700;color:var(--primary);visibility:hidden;flex-shrink:0}
.settings-option.active .settings-check{visibility:visible}
.settings-option-sub{font-weight:400;color:var(--text-secondary);font-size:0.75rem;margin-left:2px}
.content{max-width:900px;margin:0 auto;padding:16px}
.controls{
  display:flex;justify-content:center;gap:12px;margin-bottom:16px;
  flex-wrap:wrap;align-items:center;
}
.controls select{
  padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:0.9rem;background:var(--card);color:var(--text);
  cursor:pointer;max-width:400px;width:100%;font-family:inherit;
}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.tabs button{
  padding:8px 20px;border:2px solid var(--border);background:var(--card);
  color:var(--text);border-radius:8px;cursor:pointer;font-size:0.9rem;
  font-family:inherit;
}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.route-header{
  padding:10px 16px;color:#fff;border-radius:var(--radius) var(--radius) 0 0;
  font-size:1rem;font-weight:700;
}
.route-note{
  padding:4px 16px;background:#fff3e0;font-size:0.8rem;color:#e65100;
}
.shadow{
  box-shadow:var(--shadow);border-radius:var(--radius);
  overflow:hidden;margin-bottom:20px;
}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{
  background:#f0f0f0;padding:6px 8px;font-size:0.75rem;
  white-space:nowrap;border:1px solid var(--border);
  position:sticky;top:0;
}
td{
  padding:5px 8px;text-align:center;font-size:0.8rem;
  border:1px solid var(--border);white-space:nowrap;
}
td:first-child,th:first-child{
  position:sticky;left:0;z-index:1;
  background:var(--card);
}
th:first-child{background:#f0f0f0}
[data-theme="dark"] th:first-child{background:#2A2A2A}
td:first-child{font-weight:600;text-align:left;white-space:normal}
tr:nth-child(even){background:#fafafa}
tr:hover{background:#e3f2fd}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.loading{text-align:center;padding:32px;color:var(--text-secondary);font-size:0.85rem}
.meta-text{text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-bottom:16px}
.meta-text a{color:var(--primary);text-decoration:none;margin-left:8px}
.meta-text a:hover{text-decoration:underline}

/* PC: full width */
@media(min-width:768px){
  .content{max-width:100%;padding:16px 32px}
}
</style>
<script>
(function(){
  var s = localStorage.getItem('theme');
  if (s) document.documentElement.setAttribute('data-theme', s);
  var l = localStorage.getItem('lang');
  if (l) document.documentElement.setAttribute('lang', l);
})();
</script>

<body>
<header>
  <div class="header-side header-left">
    <a href="about.html" class="back-btn" data-i18n-aria="header.back" aria-label="戻る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  </div>
  <div class="header-center">
    <span id="header-date">--/--</span>
    <span id="header-dow">(-)</span>
    <span class="header-time" id="header-time">--:--</span>
  </div>
  <div class="header-side header-right">
    <div class="settings-dropdown" id="settings-dropdown">
      <div class="settings-backdrop" id="settings-backdrop"></div>
      <button class="settings-dropdown-btn" id="settings-dropdown-btn" aria-label="設定">
        <svg class="settings-icon-lang" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
        <span class="settings-sep"></span>
        <svg class="settings-icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="settings-icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="settings-dropdown-menu" id="settings-dropdown-menu">
        <div class="settings-group">
          <div class="settings-group-label" data-i18n="settings.language">言語</div>
          <button class="settings-option" data-setting="lang" data-value="ja"><span class="settings-check">✓</span>JA <span class="settings-option-sub">日本語</span></button>
          <button class="settings-option" data-setting="lang" data-value="en"><span class="settings-check">✓</span>EN <span class="settings-option-sub">English</span></button>
        </div>
        <div class="settings-group">
          <div class="settings-group-label" data-i18n="settings.theme">テーマ</div>
          <button class="settings-option" data-setting="theme" data-value="light"><span class="settings-check">✓</span><span data-i18n="settings.light">ライト</span></button>
          <button class="settings-option" data-setting="theme" data-value="dark"><span class="settings-check">✓</span><span data-i18n="settings.dark">ダーク</span></button>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="content">
  <div class="controls">
    <select id="jsonSelect" onchange="loadSelected()">
      <option value="" data-i18n="timetable.selectRoute">-- 路線を選択 --</option>
    </select>
  </div>

  <div class="tabs" id="dayTabs"></div>

  <div class="meta-text" id="meta"></div>
  <div id="content"><div class="loading" data-i18n="timetable.selectPrompt">路線を選択してください</div></div>
</div>

<script src="js/debug.js"></script>
<script src="js/i18n.js"></script>
<script>
function updateClock() {
  var n = (typeof _getDebugDatetimeNow === 'function' && _getDebugDatetimeNow()) || new Date();
  var h = String(n.getHours()).padStart(2,'0');
  var m = String(n.getMinutes()).padStart(2,'0');
  document.getElementById('header-time').textContent = h + ':' + m;
}

// JSON_FILES: dropdown entries. file = manifest base name (e.g. 'shuttle_komatsu')
const JSON_FILES = [
  { file: 'shuttle_tsurugi', i18nKey: 'timetable.route.shuttle_tsurugi', color: '#1976D2', sourceUrl: 'https://www.jaist.ac.jp/top/access/' },
  { file: 'shuttle_komatsu', i18nKey: 'timetable.route.shuttle_komatsu', color: '#43A047', sourceUrl: 'https://www.jaist.ac.jp/top/access/' },
  { file: 'ishikawa_line',   i18nKey: 'timetable.route.ishikawa_line',   color: '#6A1B9A', sourceUrl: 'https://www.hokutetsu.co.jp/railway/ishikawasen/' },
  { file: 'ir_ishikawa',     i18nKey: 'timetable.route.ir_ishikawa',     color: '#E65100', sourceUrl: 'https://www.ishikawa-railway.jp/timetable/' },
  { file: 'limo_komatsu',    i18nKey: 'timetable.route.limo_komatsu',    color: '#00838F', sourceUrl: 'https://www.hokutetsu.co.jp/airport-bus#station_airport' },
  { file: 'nomi_renkei_kitamawari',   i18nKey: 'timetable.route.nomi_renkei_kitamawari',   color: '#E91E63', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_renkei_minamimawari', i18nKey: 'timetable.route.nomi_renkei_minamimawari', color: '#7B1FA2', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_renkei_nichu',        i18nKey: 'timetable.route.nomi_renkei_nichu',        color: '#0288D1', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_renkei_teraiko',      i18nKey: 'timetable.route.nomi_renkei_teraiko',      color: '#00897B', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_kanko_matsui',        i18nKey: 'timetable.route.nomi_kanko_matsui',        color: '#F57C00', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_kanko_tojimura',      i18nKey: 'timetable.route.nomi_kanko_tojimura',      color: '#FF8F00', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_junkan_negami',       i18nKey: 'timetable.route.nomi_junkan_negami',       color: '#558B2F', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_junkan_terai',        i18nKey: 'timetable.route.nomi_junkan_terai',        color: '#2E7D32', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_junkan_iwamoto',      i18nKey: 'timetable.route.nomi_junkan_iwamoto',      color: '#795548', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_junkan_takaza',       i18nKey: 'timetable.route.nomi_junkan_takaza',       color: '#6D4C41', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_junkan_nagaya',       i18nKey: 'timetable.route.nomi_junkan_nagaya',       color: '#37474F', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
  { file: 'nomi_junkan_tsubono',      i18nKey: 'timetable.route.nomi_junkan_tsubono',      color: '#455A64', sourceUrl: 'https://www.city.nomi.ishikawa.jp/docs/1760.html' },
];
let currentColor = '#666';
let data = null;          // currently loaded regular JSON (from data/regular/*)
let currentDay = 'weekday';
let _manifest = { regular: {}, special: {} };
let _specialDataCache = {};  // schedule_key -> special JSON (per-base)

const select = document.getElementById('jsonSelect');
JSON_FILES.forEach(function(entry) {
  var opt = document.createElement('option');
  opt.value = entry.file;
  opt.textContent = t(entry.i18nKey);
  opt.dataset.i18nKey = entry.i18nKey;
  select.appendChild(opt);
});

async function loadManifestForTimetable() {
  try {
    var res = await fetch('data/manifest.json');
    _manifest = await res.json();
  } catch (e) {
    console.warn('Failed to load manifest:', e);
  }
}

// Same fallback rule as app.js pickRegularEntry
function pickRegularEntry(entries, todayStrVal) {
  if (!entries || entries.length === 0) return undefined;
  var covering = entries.filter(function(e) {
    return e.valid_from <= todayStrVal && (e.valid_until === null || todayStrVal <= e.valid_until);
  });
  if (covering.length > 0) {
    return covering.reduce(function(a, b) { return a.valid_from > b.valid_from ? a : b; });
  }
  var expired = entries.filter(function(e) {
    return e.valid_from <= todayStrVal && e.valid_until !== null && e.valid_until < todayStrVal;
  });
  if (expired.length > 0) {
    return expired.reduce(function(a, b) { return a.valid_from > b.valid_from ? a : b; });
  }
  return undefined;
}

async function loadSelected() {
  var base = select.value;
  if (!base) return;
  document.getElementById('content').innerHTML = '<div class="loading">' + t('timetable.loading') + '</div>';
  try {
    var entries = (_manifest.regular && _manifest.regular[base]) || [];
    var picked = pickRegularEntry(entries, todayStr());
    if (!picked) throw new Error('no regular file');
    var res = await fetch('data/regular/' + picked.file);
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    data._base = base;          // remember which segment_file base this is
    _specialDataCache = {};     // reset; will lazy-load when special tab clicked
    var entry = JSON_FILES.find(function(e) { return e.file === base; });
    currentColor = entry ? entry.color : '#666';
    renderDayTabs();
    // If currentDay is a special key (carried over from a previous segment),
    // make sure that special's data is loaded for the new segment before rendering.
    if (currentDay !== 'weekday' && currentDay !== 'weekend') {
      await ensureSpecialLoaded(currentDay);
    }
    updateMeta();
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">' + t('timetable.loadError') + e.message + '</div>';
  }
}

// Get manifest.special entries for the currently displayed base segment.
// Skip fallback_to entries (they aren't tabbable; they reuse weekday/weekend).
function getCurrentSpecialEntries() {
  if (!data || !data._base) return [];
  var entries = (_manifest.special && _manifest.special[data._base]) || [];
  return entries.filter(function(e) { return e.schedule_key && e.file; });
}

// Determine visible tab keys.
// Always: weekday, weekend.
// Plus: any special whose [display_from, display_until] covers today.
function getVisibleDayKeys() {
  var keys = ['weekday', 'weekend'];
  var today = todayStr();
  getCurrentSpecialEntries().forEach(function(e) {
    var df = e.display_from || (e.apply_periods && e.apply_periods[0] && e.apply_periods[0].from);
    var du = e.display_until || (e.apply_periods && e.apply_periods[e.apply_periods.length - 1] && e.apply_periods[e.apply_periods.length - 1].until);
    if (df && today < df) return;
    if (du && today > du) return;
    keys.push(e.schedule_key);
  });
  return keys;
}

function todayStr() {
  if (typeof debugTodayStr === 'function') return debugTodayStr();
  var n = new Date();
  return n.getFullYear() + '-' +
    String(n.getMonth() + 1).padStart(2, '0') + '-' +
    String(n.getDate()).padStart(2, '0');
}

function dayLabel(key) {
  if (key === 'weekday') return t('timetable.weekday');
  if (key === 'weekend') return t('timetable.weekend');
  var found = getCurrentSpecialEntries().find(function(e) { return e.schedule_key === key; });
  if (!found) return key;
  if (currentLang === 'en' && found.label_en) return found.label_en;
  if (found.label_ja) return found.label_ja;
  return key;
}

function renderDayTabs() {
  var container = document.getElementById('dayTabs');
  container.innerHTML = '';
  var keys = getVisibleDayKeys();
  if (keys.indexOf(currentDay) < 0) currentDay = 'weekday';
  keys.forEach(function(k) {
    var btn = document.createElement('button');
    btn.textContent = dayLabel(k);
    if (k === currentDay) btn.classList.add('active');
    btn.addEventListener('click', function() { switchDay(k, btn); });
    container.appendChild(btn);
  });
}

// Lazy-load a special file into _specialDataCache for the current base.
async function ensureSpecialLoaded(scheduleKey) {
  if (_specialDataCache[scheduleKey]) return _specialDataCache[scheduleKey];
  var entry = getCurrentSpecialEntries().find(function(e) { return e.schedule_key === scheduleKey; });
  if (!entry) return null;
  try {
    var res = await fetch('data/special/' + entry.file);
    if (!res.ok) throw new Error(res.status);
    _specialDataCache[scheduleKey] = await res.json();
    return _specialDataCache[scheduleKey];
  } catch (e) {
    console.warn('Failed to load special file', entry.file, e);
    return null;
  }
}

function updateMeta() {
  if (!data) return;
  var vf = null;
  var vu = null;
  if (currentDay === 'weekday' || currentDay === 'weekend') {
    vf = data.meta && data.meta.valid_from;
    vu = data.meta && data.meta.valid_until;
  } else {
    var sp = _specialDataCache[currentDay];
    if (sp && sp.meta) {
      // for specials, show apply period rather than valid_from/until
      var aps = sp.meta.apply_periods || [];
      if (aps.length > 0) {
        vf = aps[0].from;
        vu = aps[aps.length - 1].until;
      }
    }
  }
  var metaHtml = '';
  if (vf && vu) metaHtml = vf + ' ~ ' + vu;
  else if (vf) metaHtml = vf + ' ~';

  var entry = JSON_FILES.find(function(e) { return e.file === select.value; });
  if (entry && entry.sourceUrl) {
    if (metaHtml) metaHtml += ' ';
    metaHtml += '<a href="' + entry.sourceUrl + '" target="_blank" rel="noopener">' + t('timetable.sourceLink') + '</a>';
  }
  document.getElementById('meta').innerHTML = metaHtml;
}

async function switchDay(day, btn) {
  currentDay = day;
  document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  if (!data) return;
  // For special tabs, lazy-load the special file before rendering
  if (day !== 'weekday' && day !== 'weekend') {
    await ensureSpecialLoaded(day);
  }
  updateMeta();
  render();
}

// Returns the routes array to render, depending on currentDay.
// - weekday/weekend: from regular `data` (the JSON loaded into `data`)
// - special key: from the loaded special JSON in _specialDataCache, falling back
//   to whatever 'default' schedules the special routes have
function getRenderRoutes() {
  if (currentDay === 'weekday' || currentDay === 'weekend') return data.routes;
  var sp = _specialDataCache[currentDay];
  if (!sp) return [];
  return sp.routes;
}

// Get trips for a route under currentDay.
// For special: route.schedules.default
// For regular: route.schedules[currentDay]
function getRouteTrips(route) {
  if (currentDay === 'weekday' || currentDay === 'weekend') {
    return route.schedules[currentDay] || [];
  }
  return (route.schedules && route.schedules.default) || [];
}

function render() {
  var container = document.getElementById('content');
  container.innerHTML = '';
  var routes = getRenderRoutes();

  routes.forEach(function(route) {
    var trips = getRouteTrips(route);
    var stops = route.stops;

    var wrapper = document.createElement('div');
    wrapper.className = 'shadow';

    var header = document.createElement('div');
    header.className = 'route-header';
    header.style.background = currentColor;
    header.textContent = tSegRouteName(route.name);
    wrapper.appendChild(header);

    if (route.note) {
      var note = document.createElement('div');
      note.className = 'route-note';
      note.textContent = tNote(route.note);
      wrapper.appendChild(note);
    }

    var scroll = document.createElement('div');
    scroll.className = 'table-scroll';

    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var headerRow = document.createElement('tr');
    var thStop = document.createElement('th');
    thStop.textContent = t('timetable.stopHeader');
    thStop.style.minWidth = '80px';
    headerRow.appendChild(thStop);

    trips.forEach(function(_, i) {
      var th = document.createElement('th');
      th.textContent = t('timetable.tripNum', { n: i + 1 });
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    stops.forEach(function(stop, si) {
      var tr = document.createElement('tr');
      var tdStop = document.createElement('td');
      tdStop.textContent = tStop(stop);
      tr.appendChild(tdStop);

      trips.forEach(function(trip) {
        var td = document.createElement('td');
        td.textContent = trip[si] || '\u2015';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrapper.appendChild(scroll);
    container.appendChild(wrapper);
  });
}

// Override refreshUI for timetable page
function refreshUI() {
  // Re-translate route select options
  select.querySelectorAll('option').forEach(function(opt) {
    if (opt.dataset.i18nKey) opt.textContent = t(opt.dataset.i18nKey);
    else if (opt.dataset.i18n) opt.textContent = t(opt.dataset.i18n);
  });
  // Re-render table if data loaded
  if (data) {
    renderDayTabs();
    updateMeta();
    render();
  } else {
    var contentEl = document.getElementById('content');
    if (contentEl) contentEl.innerHTML = '<div class="loading">' + t('timetable.selectPrompt') + '</div>';
  }
}

initSettingsDropdown();
applyStaticTranslations();
updateClock();
setInterval(updateClock, 10000);

// Load manifest first, then auto-load first option
(async function bootstrapTimetable() {
  await loadManifestForTimetable();
  select.selectedIndex = 1;
  await loadSelected();
})();
</script>
