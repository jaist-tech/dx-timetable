<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>時刻表一覧 - JAISTバス案内</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1565C0;
  --bg:#F0F2F5;
  --card:#FFFFFF;
  --text:#1A1A2E;
  --text-secondary:#5F6368;
  --border:#E0E0E0;
  --shadow:0 2px 8px rgba(0,0,0,0.08);
  --radius:12px;
  --header-height:56px;
}
[data-theme="dark"]{
  --primary:#64B5F6;
  --bg:#121212;
  --card:#1E1E1E;
  --text:#E0E0E0;
  --text-secondary:#9E9E9E;
  --border:#333;
  --shadow:0 2px 8px rgba(0,0,0,0.3);
}
[data-theme="dark"] header{background:#1A237E}
[data-theme="dark"] table{background:var(--card)}
[data-theme="dark"] th{background:#2A2A2A;border-color:#444;color:var(--text)}
[data-theme="dark"] td{border-color:#333;color:var(--text)}
[data-theme="dark"] tr:nth-child(even){background:#252525}
[data-theme="dark"] tr:hover{background:#333}
[data-theme="dark"] .route-note{background:#332B00;color:#FFD54F}
[data-theme="dark"] select{background:#2A2A2A;color:#E0E0E0;border-color:#444}
[data-theme="dark"] .route-header{opacity:0.85}
[data-theme="dark"] .tabs button{background:#2A2A2A;color:#9E9E9E;border-color:#444}
[data-theme="dark"] .tabs button.active{background:#283593;color:#E0E0E0;border-color:#283593}

html{font-size:16px}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  min-height:100dvh;
}
header{
  height:var(--header-height);
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:12px;
  position:sticky;
  top:0;
  z-index:10;
}
header a{color:#fff;text-decoration:none;display:flex;align-items:center}
header h1{font-size:1.1rem;font-weight:700}
.back-btn{
  display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;transition:background 0.2s;
}
.back-btn:hover{background:rgba(255,255,255,0.15)}
.back-btn svg{width:20px;height:20px}
.content{max-width:900px;margin:0 auto;padding:16px}
.controls{
  display:flex;justify-content:center;gap:12px;margin-bottom:16px;
  flex-wrap:wrap;align-items:center;
}
.controls select{
  padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:0.9rem;background:var(--card);color:var(--text);
  cursor:pointer;max-width:400px;width:100%;
}
.tabs{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.tabs button{
  padding:8px 20px;border:2px solid var(--border);background:var(--card);
  color:var(--text);border-radius:8px;cursor:pointer;font-size:0.9rem;
  font-family:inherit;
}
.tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.route-header{
  padding:10px 16px;color:#fff;border-radius:var(--radius) var(--radius) 0 0;
  font-size:1rem;font-weight:700;
}
.route-note{
  padding:4px 16px;background:#fff3e0;font-size:0.8rem;color:#e65100;
}
.shadow{
  box-shadow:var(--shadow);border-radius:var(--radius);
  overflow:hidden;margin-bottom:20px;
}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{
  background:#f0f0f0;padding:6px 8px;font-size:0.75rem;
  white-space:nowrap;border:1px solid var(--border);
  position:sticky;top:0;
}
td{
  padding:5px 8px;text-align:center;font-size:0.8rem;
  border:1px solid var(--border);white-space:nowrap;
}
td:first-child{font-weight:600;text-align:left;white-space:normal}
tr:nth-child(even){background:#fafafa}
tr:hover{background:#e3f2fd}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.loading{text-align:center;padding:32px;color:var(--text-secondary);font-size:0.85rem}
.meta-text{text-align:center;color:var(--text-secondary);font-size:0.8rem;margin-bottom:16px}
.icon-moon{display:none}
[data-theme="dark"] .icon-sun{display:none}
[data-theme="dark"] .icon-moon{display:block}
.theme-btn{
  color:#fff;opacity:0.7;display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:50%;transition:opacity 0.2s,background 0.2s;
  margin-left:auto;background:none;border:none;cursor:pointer;
}
.theme-btn:hover{opacity:1;background:rgba(255,255,255,0.15)}

/* PC: full width */
@media(min-width:768px){
  .content{max-width:100%;padding:16px 32px}
}
</style>
<script>
(function(){
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();
</script>
</head>
<body>
<header>
  <a href="about.html" class="back-btn" aria-label="戻る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <h1>時刻表一覧</h1>
  <button class="theme-btn" onclick="toggleTheme()" aria-label="テーマ切替">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
</header>
<script>
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
}
</script>

<div class="content">
  <div class="controls">
    <select id="jsonSelect" onchange="loadSelected()">
      <option value="">-- 路線を選択 --</option>
    </select>
  </div>

  <div class="tabs">
    <button class="active" onclick="switchDay('weekday')">平日</button>
    <button onclick="switchDay('weekend')">土日祝</button>
  </div>

  <div class="meta-text" id="meta"></div>
  <div id="content"><div class="loading">路線を選択してください</div></div>
</div>

<script>
const JSON_FILES = [
  { file: 'data/segments/shuttle_tsurugi.json', label: 'JAISTシャトル 鶴来線', color: '#1976D2' },
  { file: 'data/segments/shuttle_komatsu.json', label: 'JAISTシャトル 小松線', color: '#43A047' },
  { file: 'data/segments/ishikawa_line.json', label: '北陸鉄道 石川線', color: '#6A1B9A' },
  { file: 'data/segments/ir_ishikawa.json', label: 'IRいしかわ鉄道', color: '#E65100' },
  { file: 'data/segments/limo_komatsu.json', label: '小松空港連絡バス', color: '#00838F' },
];
let currentColor = '#666';

let data = null;
let currentDay = 'weekday';

const select = document.getElementById('jsonSelect');
JSON_FILES.forEach(entry => {
  const opt = document.createElement('option');
  opt.value = entry.file;
  opt.textContent = entry.label;
  select.appendChild(opt);
});

async function loadSelected() {
  const file = select.value;
  if (!file) return;
  document.getElementById('content').innerHTML = '<div class="loading">読み込み中...</div>';
  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    const entry = JSON_FILES.find(e => e.file === file);
    currentColor = entry ? entry.color : '#666';
    const vf = data.meta.valid_from;
    const vu = data.meta.valid_until;
    let metaText = data.meta.operator || '';
    if (vf && vu) metaText += '　有効期間: ' + vf + ' ～ ' + vu;
    else if (vf) metaText += '　' + vf + ' 改正～';
    document.getElementById('meta').textContent = metaText;
    render();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">読み込みに失敗しました: ' + e.message + '</div>';
  }
}

function switchDay(day) {
  currentDay = day;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (data) render();
}

function render() {
  const container = document.getElementById('content');
  container.innerHTML = '';

  data.routes.forEach(route => {
    const trips = route.schedules[currentDay];
    const stops = route.stops;

    const wrapper = document.createElement('div');
    wrapper.className = 'shadow';

    const header = document.createElement('div');
    header.className = 'route-header';
    header.style.background = currentColor;
    header.textContent = route.name + '（' + trips.length + '便）';
    wrapper.appendChild(header);

    if (route.note) {
      const note = document.createElement('div');
      note.className = 'route-note';
      note.textContent = route.note;
      wrapper.appendChild(note);
    }

    const scroll = document.createElement('div');
    scroll.className = 'table-scroll';

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    const thStop = document.createElement('th');
    thStop.textContent = 'バス停/駅';
    thStop.style.minWidth = '80px';
    headerRow.appendChild(thStop);

    trips.forEach((_, i) => {
      const th = document.createElement('th');
      th.textContent = (i + 1) + '便';
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    stops.forEach((stop, si) => {
      const tr = document.createElement('tr');
      const tdStop = document.createElement('td');
      tdStop.textContent = stop;
      tr.appendChild(tdStop);

      trips.forEach(trip => {
        const td = document.createElement('td');
        td.textContent = trip[si] || '―';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    wrapper.appendChild(scroll);
    container.appendChild(wrapper);
  });
}

// Auto-load first option
select.selectedIndex = 1;
loadSelected();
</script>
</body>
</html>
